; Copied into the Tasmota source tree by `nix run .#build`.
; Seeed Studio XIAO ESP32S3 Sense: ESP32-S3R8 (8MB octal PSRAM), 8MB quad flash,
; OV3660 camera, PDM microphone, microSD.

[platformio]
default_envs            = tasmota32s3-xiao-sense

[env:tasmota32s3-xiao-sense]
extends                 = env:tasmota32_base
board                   = esp32s3-qio_opi
board_build.partitions  = partitions/esp32_partition_app3904k_fs3392k.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags             = ${env:tasmota32_base.build_flags}
                          ; camera (v2 task driver), RTSP, SPI, SD card, I2C
                          -DFIRMWARE_WEBCAM
                          ; I2S: PDM mic, MP3/Opus streaming, Berry audio
                          -DUSE_I2S_ALL
                          ; port 81 is taken by the webcam MJPEG stream
                          -DMP3_STREAM_PORT=82
                          ; TensorFlow Lite Micro for Berry, with ESP-NN optimized kernels
                          -DUSE_BERRY_TF_LITE
                          -DESP_NN
                          -DOTA_URL='""'
lib_extra_dirs          = ${env:tasmota32_base.lib_extra_dirs}
                          lib/libesp32_ml
